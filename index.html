<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>雨</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#29435c;background:linear-gradient(145deg,#e8f4fc,#fafdff 55%,#d5e9f8)}.wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(940px,100%);min-height:560px;display:grid;grid-template-columns:1fr 1fr;overflow:hidden;border-radius:28px;background:#ffffffd9;border:1px solid #fff;box-shadow:0 24px 80px #4c7fa522}.visual{position:relative;min-height:560px;overflow:hidden;background:linear-gradient(#b7d9ef,#e8f5fd 58%,#9fc6e1)}.orb{position:absolute;top:65px;left:50%;width:190px;height:190px;transform:translateX(-50%);border-radius:50%;background:#ffffff8c}.ridge{position:absolute;bottom:-60px;left:-15%;width:130%;height:270px;border-radius:50% 50% 0 0;background:linear-gradient(145deg,#8eb8d6,#527fa5);transform:rotate(-8deg)}.ridge.r2{bottom:-125px;left:10%;height:240px;background:linear-gradient(145deg,#c0ddec,#739fbe);transform:rotate(9deg)}.water{position:absolute;bottom:0;width:100%;height:32%;background:linear-gradient(#b8d9edaa,#e4f3fc);clip-path:polygon(0 30%,100% 0,100% 100%,0 100%)}.visualcopy{position:absolute;bottom:32px;left:30px;color:white;text-shadow:0 2px 14px #335b7c}.visualcopy small{letter-spacing:3px}.visualcopy h2{font:42px Georgia,serif;margin:10px 0}.content{padding:48px 42px;display:flex;flex-direction:column;justify-content:center}.eyebrow{font-size:11px;letter-spacing:3px;color:#8aa8c1}.title{font:normal 60px Georgia,"Songti SC",serif;letter-spacing:12px;color:#315d85;margin:12px 0 0}.sub{font-size:13px;letter-spacing:2px;color:#91a9be;margin:4px 0 32px}.buttons{display:grid;gap:12px}.btn{font:inherit;cursor:pointer;border:1px solid #d7e6f2;background:#fff;color:#47769f;border-radius:14px;padding:15px 17px;display:flex;justify-content:space-between;align-items:center;text-align:left;transition:.18s}.btn:hover{background:#f3f9ff;border-color:#a9cde8;transform:translateY(-1px)}.btn.primary{background:linear-gradient(110deg,#78acd6,#4e85b8);border:0;color:white;box-shadow:0 10px 22px #4e85b833}.tiny{font-size:11px;color:#9cb1c3;letter-spacing:1px;margin-top:25px}.overlay{display:none;position:fixed;inset:0;z-index:10;background:#24496755;backdrop-filter:blur(7px);padding:18px;align-items:center;justify-content:center}.overlay.open{display:flex}.dialog{width:min(500px,100%);background:#fbfdff;border-radius:22px;padding:24px;border:1px solid white;box-shadow:0 20px 70px #264d6b33}.dialog h2{margin:0;font-weight:500}.dialog p{font-size:13px;line-height:1.6;color:#7891a7}.dialog label{display:block;margin:12px 0 6px;font-size:12px;color:#6e89a2}.dialog input,.dialog textarea{width:100%;border:1px solid #dce9f4;border-radius:10px;padding:11px;font:inherit;background:white;color:#29435c}.dialog textarea{min-height:75px}.row{display:flex;gap:10px;margin-top:18px}.row .btn{flex:1;justify-content:center}.play{display:none;position:fixed;inset:0;z-index:5;overflow:auto;background:linear-gradient(145deg,#e8f4fc,#fbfdff);padding:20px}.play.open{display:block}.playcard{max-width:800px;margin:5vh auto;padding:26px;background:#ffffffdf;border:1px solid white;border-radius:22px;box-shadow:0 20px 60px #4c7fa522}.playtop{display:flex;justify-content:space-between;align-items:center;gap:10px}.playcard h2{font-weight:500}.story{line-height:1.9;color:#526f89;white-space:pre-wrap}.choices{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.choices .btn{background:#f5faff}.toast{position:fixed;z-index:20;bottom:20px;left:50%;transform:translateX(-50%);display:none;background:#315f87;color:white;border-radius:24px;padding:10px 16px;font-size:13px}@media(max-width:680px){.card{grid-template-columns:1fr;min-height:0}.visual{min-height:230px}.orb{width:130px;height:130px;top:22px}.ridge{height:150px;bottom:-50px}.ridge.r2{height:130px;bottom:-70px}.visualcopy{left:22px;bottom:18px}.visualcopy h2{font-size:30px}.content{padding:28px 24px}.title{font-size:48px}.sub{margin-bottom:22px}}
</style>
</head>
<body>
<main class="wrap" id="menu"><section class="card">
<div class="visual"><div class="orb"></div><div class="ridge"></div><div class="ridge r2"></div><div class="water"></div><div class="visualcopy"><small>RAIN · ROMANCE STORY</small><h2>雨落时分</h2><span>在城市里，遇见属于你的故事</span></div></div>
<div class="content"><div class="eyebrow">A FREE ROMANCE GAME</div><h1 class="title">雨</h1><div class="sub">自由恋爱 · 城市漫游</div>
<div class="buttons"><button class="btn primary" id="start"><span>开始游戏</span><span>↗</span></button><button class="btn" id="save"><span>存档</span><span>⌁</span></button><button class="btn" id="api"><span>API</span><span>⚙</span></button></div><div class="tiny">YOUR STORY, YOUR CHOICE.</div></div>
</section></main>
<section class="play" id="play"><div class="playcard"><div class="playtop"><div><div class="eyebrow">雨 · CHAPTER 01</div><h2 id="chapter">初遇</h2></div><button class="btn" id="return">返回标题</button></div><p class="story" id="story">雨丝落在城市街道上。你走进一家窗边咖啡馆，恰好看见一位熟悉又陌生的人。</p><p class="story" id="progress">地点：上海 · 街角咖啡馆　关系：初识</p><div class="choices"><button class="btn" data-choice="坐到窗边，点一杯热咖啡。">坐到窗边</button><button class="btn" data-choice="向那个人打声招呼。">主动打招呼</button><button class="btn" data-choice="先看看窗外的雨。">看看窗外</button></div></div></section>
<div class="overlay" id="apiModal"><div class="dialog"><h2>API 设置</h2><p>填写兼容 OpenAI Chat Completions 的接口。API 密钥仅保存在此浏览器；正式发布建议通过后端代理保护密钥。</p><label>API Base URL</label><input id="base" placeholder="https://your-api.example/v1"><label>模型名称</label><input id="model" placeholder="model-name"><label>API Key</label><input id="key" type="password" placeholder="API Key（可留空使用演示剧情）"><label>角色设定</label><textarea id="prompt">你是恋爱游戏《雨》中的角色。请用自然、有个性的中文回应玩家，不替玩家做决定。</textarea><div class="row"><button class="btn" id="cancel">取消</button><button class="btn primary" id="saveApi">保存设置</button></div></div></div>
<div class="overlay" id="saveModal"><div class="dialog"><h2>存档</h2><p id="saveInfo">可以保存或读取本地浏览器中的游戏进度。</p><div class="row"><button class="btn" id="closeSave">关闭</button><button class="btn" id="loadSave">读取存档</button><button class="btn primary" id="saveNow">保存进度</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
"use strict";
const el=id=>document.getElementById(id);
let step=0, log=[], currentStory="雨丝落在城市街道上。你走进一家窗边咖啡馆，恰好看见一位熟悉又陌生的人。";
function notify(msg){const t=el("toast");t.textContent=msg;t.style.display="block";window.clearTimeout(notify.timer);notify.timer=window.setTimeout(()=>t.style.display="none",2200);}
function openModal(id){el(id).classList.add("open");}
function closeModal(id){el(id).classList.remove("open");}
function showPlay(){el("menu").style.display="none";el("play").classList.add("open");}
function showMenu(){el("play").classList.remove("open");el("menu").style.display="grid";}
function render(){el("story").textContent=currentStory;el("chapter").textContent=step===0?"初遇":step===1?"雨中的回应":"新的章节";el("progress").textContent="地点：上海 · 街角咖啡馆　关系："+(step===0?"初识":"逐渐熟悉")+"　剧情进度："+step;}
el("start").addEventListener("click",()=>{step=0;log=[];currentStory="雨丝落在城市街道上。你走进一家窗边咖啡馆，恰好看见一位熟悉又陌生的人。";render();showPlay();});
el("return").addEventListener("click",showMenu);
el("api").addEventListener("click",()=>{const cfg=JSON.parse(localStorage.getItem("yu_api")||"{}");el("base").value=cfg.base||"";el("model").value=cfg.model||"";el("key").value=cfg.key||"";el("prompt").value=cfg.prompt||el("prompt").value;openModal("apiModal");});
el("cancel").addEventListener("click",()=>closeModal("apiModal"));
el("saveApi").addEventListener("click",()=>{localStorage.setItem("yu_api",JSON.stringify({base:el("base").value.trim(),model:el("model").value.trim(),key:el("key").value.trim(),prompt:el("prompt").value}));closeModal("apiModal");notify("API 设置已保存");});
el("save").addEventListener("click",()=>{const s=localStorage.getItem("yu_game_save");el("saveInfo").textContent=s?"发现本地存档。你可以读取，也可以覆盖保存。":"目前没有存档。开始游戏后即可保存进度。";openModal("saveModal");});
el("closeSave").addEventListener("click",()=>closeModal("saveModal"));
el("saveNow").addEventListener("click",()=>{localStorage.setItem("yu_game_save",JSON.stringify({step,log,currentStory}));el("saveInfo").textContent="保存成功！进度已保存在当前浏览器。";notify("存档成功");});
el("loadSave").addEventListener("click",()=>{const s=localStorage.getItem("yu_game_save");if(!s){el("saveInfo").textContent="没有找到存档。";return;}try{const d=JSON.parse(s);step=d.step||0;log=d.log||[];currentStory=d.currentStory||currentStory;render();closeModal("saveModal");showPlay();notify("读取存档成功");}catch(e){el("saveInfo").textContent="存档读取失败，可能数据已损坏。";}});
document.querySelectorAll("[data-choice]").forEach(btn=>btn.addEventListener("click",async()=>{const choice=btn.dataset.choice;log.push(choice);step++;currentStory="你选择了："+choice+"\n\n对方抬起头，轻轻笑了笑。窗外的雨声仿佛在这一刻变得柔和。";render();notify("剧情已推进");const cfg=JSON.parse(localStorage.getItem("yu_api")||"{}");if(!cfg.key||!cfg.base||!cfg.model)return;btn.disabled=true;try{const base=cfg.base.replace(/\/+$/,"");const response=await fetch(base+"/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+cfg.key},body:JSON.stringify({model:cfg.model,messages:[{role:"system",content:cfg.prompt+" 当前剧情：雨天咖啡馆初遇。玩家选择："+choice+"。请继续剧情并提供后续互动，不替玩家做选择。"},{role:"user",content:"请继续描写故事。"}],temperature:0.85})});const data=await response.json();if(!response.ok)throw new Error(data.error?.message||"HTTP "+response.status);currentStory=data.choices?.[0]?.message?.content||currentStory;render();}catch(err){notify("API 请求失败，已保留演示剧情");console.error(err);}finally{btn.disabled=false;}}));
document.querySelectorAll(".overlay").forEach(m=>m.addEventListener("click",e=>{if(e.target===m)m.classList.remove("open");}));
</script>
</body>
</html>
